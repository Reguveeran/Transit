name: UniTransit CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =================================================================
  # UniTransit 11-Stage CI/CD Deployment Pipeline
  # =================================================================

  # Stage 1 - 4: Quality Gates & Artifact Builds
  ci-quality-gate:
    name: "Stages 1-4: CI Quality Gate & Builds"
    runs-on: ubuntu-latest
    steps:
      # Stage 1: Checkout Code
      - name: "Stage 1: Checkout Code"
        uses: actions/checkout@v4

      # Stage 2: Backend Dependencies & Environment Setup
      - name: "Stage 2: Set up Python & Install Backend Dependencies"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & Linters
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt flake8

      - name: Code Style & Quality Linting (flake8)
        run: |
          flake8 backend adapters workers tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend adapters workers tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      # Stage 3: Automated Tests (Regression Baseline)
      - name: "Stage 3: Run Automated Test Suite (API, Workers, Pipelines, Rollbacks)"
        run: |
          PYTHONPATH=backend:. python backend/manage.py test tests -v 2

      # Stage 4: Frontend Build
      - name: "Stage 4: Set up Node.js & Build Production Frontend Bundle"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies & Vite Production Build
        run: |
          cd frontend
          npm ci
          npm run build

  # Stage 5 - 7: Immutable Container Tagging & Security Scanning
  container-delivery:
    name: "Stages 5-7: Container Delivery & Trivy Scanning"
    needs: ci-quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: "Stage 1 (Re-check): Checkout Code"
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      # Stage 5: Docker Build with Git SHA Tags
      - name: "Stage 5: Build Docker Images (Worker, Backend, Frontend) with Immutable Git SHA"
        run: |
          echo "Building immutable container images tagged by Git SHA: ${{ github.sha }}"
          docker build -t unitransit/backend:${{ github.sha }} -f docker/Dockerfile.backend .
          docker build -t unitransit/worker:${{ github.sha }} -f docker/Dockerfile.backend .
          docker build -t unitransit/frontend:${{ github.sha }} -f docker/Dockerfile.frontend .

      # Stage 6: Trivy Security Scan
      - name: "Stage 6: Run Trivy Security Vulnerability Scan"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'unitransit/worker:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Stage 7: Push Images to Container Registry
      - name: "Stage 7: Push Immutable Images to Container Registry"
        run: |
          echo "Simulating push of immutable images to registry: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Tagged images ready for deployment: unitransit/worker:${{ github.sha }}"

  # Stage 8 - 11: Kubernetes Orchestration, Verification & Rollback Guard
  kubernetes-deployment:
    name: "Stages 8-11: Kubernetes Deployment & Automated Rollback Guard"
    needs: container-delivery
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.KUBECONFIG != ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      # Stage 8: Deploy to Kubernetes
      - name: "Stage 8: Deploy Immutable Image to Kubernetes Cluster"
        run: |
          echo "Deploying unitransit/worker:${{ github.sha }} via RollingUpdate..."
          kubectl set image deployment/worker-position \
            worker-position=unitransit/worker:${{ github.sha }} \
            -n unitransit --record

      # Stage 9: Wait for Rollout
      - name: "Stage 9: Wait for Kubernetes Rollout to Complete"
        id: rollout_wait
        run: |
          echo "Waiting for worker-position rollout (timeout: 120s)..."
          kubectl rollout status deployment/worker-position -n unitransit --timeout=120s

      # Stage 10: Verify Readiness
      - name: "Stage 10: Verify Pod Readiness & Stream Health"
        run: |
          echo "Verifying ready replicas in unitransit namespace..."
          READY=$(kubectl get deployment worker-position -n unitransit -o jsonpath='{.status.readyReplicas}')
          DESIRED=$(kubectl get deployment worker-position -n unitransit -o jsonpath='{.spec.replicas}')
          echo "Replicas status: $READY / $DESIRED ready."
          if [ "$READY" != "$DESIRED" ]; then
            echo "Readiness check failed: ready replicas ($READY) != desired ($DESIRED)"
            exit 1
          fi

      # Stage 11: Rollback on Failure
      - name: "Stage 11: Rollback on Failure (Automated Emergency Guard)"
        if: failure()
        run: |
          echo "⚠️ Deployment or readiness failure detected! Executing emergency rollback..."
          kubectl rollout undo deployment/worker-position -n unitransit
          kubectl rollout status deployment/worker-position -n unitransit --timeout=60s
          echo "✅ Rollback completed successfully. Stable revision restored with 0 lost events."
          exit 1
