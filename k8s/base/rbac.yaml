apiVersion: v1
kind: ServiceAccount
metadata:
  name: unitransit-backend-sa
  namespace: unitransit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unitransit-app-role
  namespace: unitransit
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["endpoints", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unitransit-app-rolebinding
  namespace: unitransit
subjects:
  - kind: ServiceAccount
    name: unitransit-backend-sa
    namespace: unitransit
roleRef:
  kind: Role
  name: unitransit-app-role
  apiGroup: rbac.authorization.k8s.io
