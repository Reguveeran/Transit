apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: unitransit
  labels:
    app: simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
        - name: simulator
          image: unitransit/simulator:latest
          command:
            - python
            - adapters/simulator/simulator.py
            - --vehicles
            - "100"
            - --interval
            - "2.0"
            - --redis-host
            - redis-service
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
