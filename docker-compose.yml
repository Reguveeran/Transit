version: '3.8'

services:
  # ==========================================
  # Database Layer (PostgreSQL + PostGIS)
  # ==========================================
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: unitransit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unitransit}
      POSTGRES_USER: ${POSTGRES_USER:-unitransit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unitransit_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unitransit} -d ${POSTGRES_DB:-unitransit}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Real-Time Event Broker (Redis)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: unitransit-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  # Observability Layer
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: unitransit-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.1.0
    container_name: unitransit-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
