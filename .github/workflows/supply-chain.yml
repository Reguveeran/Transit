name: Container Supply Chain & Security Hardening

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ==============================================================================
  # Job 1: Test & Quality Gate (Zero-Regression Baseline)
  # ==============================================================================
  quality-gate:
    name: "1. Quality Gate & Regression Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Linters
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt flake8 pytest pytest-django

      - name: Code Quality & Security Linting (Flake8)
        run: |
          flake8 backend adapters workers tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend adapters workers tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Full Regression Test Suite (77/77 Tests)
        run: |
          PYTHONPATH=backend:. pytest tests/ -v

      - name: Set up Node.js 20 & Build Frontend Assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies & Validate Build
        run: |
          cd frontend
          npm ci
          npm run build

  # ==============================================================================
  # Job 2: Build & Trivy Security Scan (Build Once, Scan Once)
  # ==============================================================================
  build-and-scan:
    name: "2. Build & Trivy Vulnerability Scan"
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: backend
            dockerfile: docker/Dockerfile.backend
            image_name: unitransit-backend
          - name: worker
            dockerfile: docker/Dockerfile.worker
            image_name: unitransit-worker
          - name: frontend
            dockerfile: docker/Dockerfile.frontend
            image_name: unitransit-frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Set Image Tag Metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component.image_name }}:${SHORT_SHA}"
          IMAGE_FULL_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component.image_name }}:${{ github.sha }}"
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_full_tag=${IMAGE_FULL_TAG}" >> $GITHUB_OUTPUT

      # Build image locally for scanning
      - name: Build Container Image (Immutable Git SHA)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_full_tag }}
            ${{ matrix.component.image_name }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy Security Scan: Table Output
      - name: Run Trivy Vulnerability Scan (Table Output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.meta.outputs.image_tag }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Trivy Security Scan: SARIF Report for GitHub Security Tab
      - name: Run Trivy Vulnerability Scan (SARIF Report)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.meta.outputs.image_tag }}'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.component.name }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF Report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.component.name }}.sarif'
          category: 'trivy-${{ matrix.component.name }}'

      # Log in to GitHub Container Registry (GHCR) and Push Immutable Artifacts
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Immutable Image to GHCR
        if: github.event_name != 'pull_request'
        id: push_step
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_full_tag }}
          cache-from: type=gha

      - name: Export Image Digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Component: ${{ matrix.component.name }}"
          echo "Tag: ${{ steps.meta.outputs.image_tag }}"
          echo "Digest: ${{ steps.push_step.outputs.digest }}"

  # ==============================================================================
  # Job 3: Immutable Artifact Promotion Manifest
  # ==============================================================================
  record-promotion-manifest:
    name: "3. Generate Promotion Manifest"
    needs: build-and-scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Generate Promotion Digest Summary
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cat <<EOF > promotion-manifest.json
          {
            "commit_sha": "${{ github.sha }}",
            "short_sha": "${SHORT_SHA}",
            "build_timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "images": {
              "backend": "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/unitransit-backend:${SHORT_SHA}",
              "worker": "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/unitransit-worker:${SHORT_SHA}",
              "frontend": "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/unitransit-frontend:${SHORT_SHA}"
            },
            "promotion_path": "Dev (unitransit-dev) -> Staging (unitransit-staging) -> Prod (unitransit-prod)"
          }
          EOF
          cat promotion-manifest.json

      - name: Upload Promotion Artifact
        uses: actions/upload-artifact@v4
        with:
          name: promotion-manifest-${{ github.sha }}
          path: promotion-manifest.json
